name: iOS

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build for Simulator
        run: >-
          xcodebuild
          -project Islemetry.xcodeproj
          -scheme Islemetry
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build unsigned AltStore IPA
        run: ./script/build_altstore_ipa.sh
      - name: Finalize and validate AltStore source
        run: |
          python3 script/update_altstore_source.py dist/Islemetry-0.2.0.ipa altstore/source.json
          python3 script/validate_altstore.py altstore/source.json dist/Islemetry-0.2.0.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Islemetry-AltStore-0.2.0
          path: |
            dist/Islemetry-0.2.0.ipa
            altstore/source.json
