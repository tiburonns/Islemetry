name: Provenance Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify provenance files and source anchor
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f NOTICE
          test -f AUTHORS
          test -f PROVENANCE.md
          test -f .github/CODEOWNERS
          grep -Fq "TBNS-IM-26-2D85C9" "Islemetry/App/IslemetryApp.swift"
          grep -Fq "https://github.com/tiburonns/Islemetry" PROVENANCE.md
